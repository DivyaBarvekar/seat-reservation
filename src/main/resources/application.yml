server:
  port: ${PORT:8080}

spring:
  application:
    name: seat-reservation
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/seats}
    username: ${DATABASE_USER:app}
    password: ${DATABASE_PASSWORD:app}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 3000
  jackson:
    property-naming-strategy: SNAKE_CASE

app:
  auth:
    secret: ${AUTH_SECRET:local-dev-secret-change-me-at-least-32-chars}
    admin-token: ${ADMIN_TOKEN:local-admin-token}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db