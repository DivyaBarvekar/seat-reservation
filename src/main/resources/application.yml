server:
  port: ${PORT:8080}
  tomcat:
    # Bounded worker pool: at most this many requests compete for DB connections at once;
    # the rest wait in Tomcat's connection queue instead of piling up on Hikari and timing out.
    threads:
      max: ${TOMCAT_MAX_THREADS:200}
    max-connections: ${TOMCAT_MAX_CONNECTIONS:10000}
    accept-count: ${TOMCAT_ACCEPT_COUNT:2000}

spring:
  application:
    name: seat-reservation
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/seats}
    username: ${DATABASE_USER:app}
    password: ${DATABASE_PASSWORD:app}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      # Long enough to ride out a burst queue, short enough to fail closed (503) if the DB is gone.
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:10000}
      # A request never waits forever on a row lock; a timeout surfaces as a clean 409 contention.
      connection-init-sql: SET lock_timeout = '5s'
  jackson:
    property-naming-strategy: SNAKE_CASE

app:
  auth:
    secret: ${AUTH_SECRET:local-dev-secret-change-me-at-least-32-chars}
    admin-token: ${ADMIN_TOKEN:local-admin-token}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db