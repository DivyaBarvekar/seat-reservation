services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: seats
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports: [ "5432:5432" ]
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U app -d seats" ]
      interval: 2s
      timeout: 3s
      retries: 20

  app:
    build: .
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/seats
      DATABASE_USER: app
      DATABASE_PASSWORD: app
    ports: [ "8080:8080" ]
    depends_on:
      db:
        condition: service_healthy